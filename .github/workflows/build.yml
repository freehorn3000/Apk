name: build
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: unzip -q Modiriat.zip
      - name: Prepare signing
        env: { KS_B64: "${{ secrets.KS_B64 }}" }
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.p12"
            echo "KS_FILE=$RUNNER_TEMP/ks.p12" >> "$GITHUB_ENV"
          fi
      - run: cd Modiriat && gradle assembleRelease
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
      - uses: actions/upload-artifact@v4
        with: { name: Modiriat-apk, path: Modiriat/app/build/outputs/apk/release/*.apk }
